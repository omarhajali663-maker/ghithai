const key=()=>new Date().toISOString().slice(0,10);
function migrateData(){
  let changed=false;
  foods=foods.map(f=>{
    if(f.unit)return f;
    const n={}; Object.keys(f.n||{}).forEach(k=>n[k]=Number(f.n[k])||0);
    changed=true; return {...f,n,unit:'g',unitLabel:'غرام'};
  });
  Object.keys(logs).forEach(d=>logs[d]=(logs[d]||[]).map(x=>{
    if(x.unit)return x;
    changed=true; return {...x,qty:Number(x.grams)||0,unit:'g',unitLabel:'غرام'};
  }));
  if(changed)save();
}
function save(){localStorage.setItem('foods_v1',JSON.stringify(foods));localStorage.setItem('logs_v1',JSON.stringify(logs))}
function fmt(v){return Math.round((Number(v)||0)*10)/10}
function fmtQty(v){return Number.isInteger(Number(v))?String(Number(v)):String(Math.round(Number(v)*10)/10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
migrateData();
function today(){return logs[key()]||[]}
function sum(){let s={cal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0,sodium:0,satfat:0,cholesterol:0};today().forEach(x=>Object.keys(s).forEach(k=>s[k]+=(x.n[k]||0)));return s}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='foods')renderFoods();if(id==='reports')renderReports()}
function pct(x,g){return Math.min(100,Math.round(x/g*100))}
function renderHome(){let s=sum();document.getElementById('calNow').textContent=Math.round(s.cal);document.getElementById('calRemain').textContent='المتبقي '+Math.max(0,Math.round(GOALS.cal-s.cal));document.getElementById('ring').style.setProperty('--p',pct(s.cal,GOALS.cal)+'%');['protein','carbs','fat','fiber'].forEach(k=>{document.getElementById(k[0]==='p'?'pNow':k[0]==='c'?'cNow':k[0]==='f'&&k!=='fiber'?'fNow':'fiNow').textContent=Math.round(s[k]);document.getElementById(k==='protein'?'pBar':k==='carbs'?'cBar':k==='fat'?'fBar':'fiBar').style.width=pct(s[k],GOALS[k])+'%'});
let box=document.getElementById('todayFoods');box.innerHTML=today().length?today().map((x,i)=>`<div class="food"><div class="foodinfo"><div class="foodname">${esc(x.name)}</div><div class="foodmeta">${fmtQty(x.qty??x.grams)} ${esc(x.unitLabel||'غرام')}</div></div><div class="foodcal">${Math.round(x.n.cal)} سعرة</div><button class="icon" onclick="removeLog(${i})">×</button></div>`).join(''):'<div class="empty">لم تسجّل أي طعام اليوم بعد.</div>'}
function renderFoods(){let q=(document.getElementById('search')?.value||'').trim().toLowerCase();let arr=foods.filter(f=>f.name.toLowerCase().includes(q));document.getElementById('foodList').innerHTML=arr.length?arr.map(f=>`<div class="food" onclick="openFood(${f.id})"><div class="foodinfo"><div class="foodname">${esc(f.name)}</div><div class="foodmeta">${f.unit==='g'?'لكل 100 غرام':'لكل '+esc(f.unitLabel||'غرام')} · بروتين ${fmt(f.n.protein)}غ</div></div><div class="foodcal">${f.unit==='g'?fmt(f.n.cal):fmt(f.n.cal)} سعرة</div></div>`).join(''):'<div class="card empty">قائمة الأطعمة فارغة.<br>أضف أول طعام خاص بك.</div>'}
function openFoodList(){go('foods')}
function toggleCustomUnit(){const custom=document.getElementById('unit')?.value==='custom';const w=document.getElementById('customUnitWrap');if(w)w.style.display=custom?'block':'none'}
function openAddFood(){
  document.getElementById('sheet').innerHTML=`<div class="sheettop"><h2>إضافة طعام</h2><button class="icon" onclick="closeModal()">×</button></div>
  <div class="ready-head"><div><div class="ready-title">🍽️ أطعمة جاهزة</div><p class="ready-sub">اختر طعامًا شائعًا لإضافته إلى <b>مكتبتك</b> فورًا. لن يُسجّل كوجبة حتى تختار الكمية وتضغط «تم الأكل».</p></div></div>
  <div class="ready-search"><input id="readySearch" class="input" placeholder="🔎 ابحث في الأطعمة الجاهزة..." oninput="renderReadyFoods()"></div>
  <div id="readyList" class="ready-list"></div>
  <div class="ready-note">💡 القيم المعروضة لكل 100 غ أو 100 مل، باستثناء الوحدات الفردية مثل البيضة. انتبه إلى حالة الطعام: «مطبوخ» و«جاف» ليستا الشيء نفسه.</div>
  <div class="divider">أو</div>
  <button class="secondary" onclick="openManualAddFood()">＋ إضافة طعام يدويًا</button>`;
  showModal();renderReadyFoods();
}
function renderReadyFoods(){
  const q=(document.getElementById('readySearch')?.value||'').trim().toLowerCase();
  const arr=READY_FOODS.filter(f=>f.name.toLowerCase().includes(q));
  const box=document.getElementById('readyList');if(!box)return;
  box.innerHTML=arr.length?arr.map((f,i)=>`<button class="ready-item" onclick="addReadyFood(${READY_FOODS.indexOf(f)})"><span class="ready-add">＋</span><div class="ready-icon">${f.icon}</div><div class="ready-name">${esc(f.name)}</div><div class="ready-meta">${f.unit==='g'?'لكل 100 غ':f.unit==='ml'?'لكل 100 مل':'لكل '+esc(f.unitLabel)}</div><div class="ready-kcal">${fmt(f.n.cal)} kcal</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1;padding:22px 8px">لا يوجد طعام مطابق للبحث.</div>';
}
function addReadyFood(index){
  const f=READY_FOODS[index];if(!f)return;
  const existing=foods.find(x=>x.name===f.name && x.unit===f.unit);
  if(existing){closeModal();go('foods');toast('هذا الطعام موجود بالفعل في مكتبتك ✓');return;}
  foods.push({id:Date.now()+index,name:f.name,n:{...f.n},unit:f.unit,unitLabel:f.unitLabel,ready:true});
  save();closeModal();renderFoods();toast('تمت إضافة '+f.name+' إلى مكتبتك ✓');
}
function openManualAddFood(){
  document.getElementById('sheet').innerHTML=`<div class="sheettop"><h2>إضافة طعام يدويًا</h2><button class="icon" onclick="closeModal()">×</button></div><p class="muted">أدخل القيم الغذائية <b>لكل 100 غرام أو 100 مل</b> عند اختيار الغرام أو المل، أو <b>لكل وحدة</b> لباقي الوحدات. مثال: البيضة = قيم بيضة واحدة.</p><div class="field"><label>اسم الطعام *</label><input id="fn" class="input" placeholder="مثال: بيض"></div><div class="field"><label>وحدة القياس *</label><select id="unit" class="input unitselect" onchange="toggleCustomUnit()">${UNITS.map(u=>`<option value="${u[0]}">${u[1]}</option>`).join('')}</select></div><div class="field" id="customUnitWrap" style="display:none"><label>اسم الوحدة المخصص *</label><input id="customUnit" class="input" placeholder="مثال: شريحة"></div><div class="formgrid">${['cal','protein','carbs','fat','fiber','sugar','sodium','satfat','cholesterol'].map(k=>`<div class="field"><label>${NAMES[k]} (${k==='sodium'||k==='cholesterol'?'ملغ':k==='cal'?'kcal':'غ'})</label><input id="n_${k}" class="input" type="number" min="0" step="0.1" value="0"></div>`).join('')}</div><button class="primary" onclick="saveFood()">حفظ الطعام</button><button class="secondary" style="margin-top:8px" onclick="openAddFood()">← العودة للأطعمة الجاهزة</button>`;
  showModal();
}
function saveFood(){let name=document.getElementById('fn').value.trim();if(!name){toast('أدخل اسم الطعام أولاً');return}let unit=document.getElementById('unit').value,unitLabel=unit==='custom'?document.getElementById('customUnit').value.trim():UNIT_LABELS[unit];if(!unitLabel){toast('أدخل اسم الوحدة المخصصة');return}let n={};['cal','protein','carbs','fat','fiber','sugar','sodium','satfat','cholesterol'].forEach(k=>n[k]=Number(document.getElementById('n_'+k).value)||0);foods.push({id:Date.now(),name,n,unit,unitLabel,ready:false});save();closeModal();renderFoods();toast('تم حفظ الطعام ✓')}
function openFood(id){let f=foods.find(x=>x.id===id);if(!f)return;let unit=f.unit||'g',label=f.unitLabel||'غرام',initial=(unit==='g'||unit==='ml')?100:1;document.getElementById('sheet').innerHTML=`<div class="sheettop"><h2>${esc(f.name)}</h2><button class="icon" onclick="closeModal()">×</button></div><div class="muted">حدد الكمية التي تناولتها</div><div class="qty"><button onclick="changeQty(-1)">−</button><div class="qtyval"><b id="qty">${fmtQty(initial)}</b><span id="qtyUnit">${esc(label)}</span></div><button onclick="changeQty(1)">＋</button></div><div class="field"><label>أو اكتب الكمية مباشرة</label><input id="qtyInput" class="input" type="number" min="0.1" step="0.1" value="${initial}" oninput="setQty(this.value)"></div><div class="card"><h3>القيمة الغذائية لهذه الكمية</h3><div class="nutrition" id="selectedNut"></div></div><button class="primary" onclick="eat(${id})">تم الأكل ✓</button><button class="secondary" style="margin-top:8px" onclick="closeModal()">إلغاء</button>`;showModal();window.currentFood=f;window.currentQty=initial;updateSelected()}
function changeQty(d){let f=window.currentFood,step=f?.unit==='g'||f?.unit==='ml'?10:1;window.currentQty=Math.max(0.1,Math.min(10000,Number(window.currentQty||0)+d*step));document.getElementById('qty').textContent=fmtQty(window.currentQty);document.getElementById('qtyInput').value=window.currentQty;updateSelected()}
function setQty(v){window.currentQty=Math.max(0.1,Math.min(10000,Number(v)||0.1));document.getElementById('qty').textContent=fmtQty(window.currentQty);updateSelected()}
function calcFoodN(f,q){let factor=(f.unit==='g'||f.unit==='ml')?q/100:q;let s={};Object.keys(f.n).forEach(k=>s[k]=f.n[k]*factor);return s}
function updateSelected(){let f=window.currentFood,q=window.currentQty||1,s=calcFoodN(f,q);document.getElementById('selectedNut').innerHTML=Object.entries(s).map(([k,v])=>`<div class="nrow"><span>${NAMES[k]}</span><b>${k==='sodium'||k==='cholesterol'?Math.round(v)+' ملغ':k==='cal'?Math.round(v)+' kcal':fmt(v)+' غ'}</b></div>`).join('')}
function eat(id){let f=foods.find(x=>x.id===id),q=window.currentQty||1,n=calcFoodN(f,q);if(!logs[key()])logs[key()]=[];logs[key()].push({name:f.name,qty:q,unit:f.unit||'g',unitLabel:f.unitLabel||'غرام',n});save();closeModal();go('home');toast('تمت إضافة الطعام إلى اليوم ✓')}

function removeLog(i){logs[key()].splice(i,1);save();renderHome();toast('تم حذف الطعام')}
function renderReports(){let s=sum();document.getElementById('reportCal').textContent=Math.round(s.cal);document.getElementById('reportRows').innerHTML=[['السعرات','cal','kcal'],['البروتين','protein','غ'],['الكربوهيدرات','carbs','غ'],['الدهون','fat','غ'],['الألياف','fiber','غ'],['السكر','sugar','غ'],['الصوديوم','sodium','ملغ']].map(a=>`<div class="nrow"><span>${a[0]}</span><b>${Math.round(s[a[1]]*10)/10} ${a[2]}</b></div>`).join('')}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function showSettings(){document.getElementById('sheet').innerHTML=`<div class="sheettop"><h2>الإعدادات</h2><button class="icon" onclick="closeModal()">×</button></div><div class="card"><h3>أهدافك الحالية</h3><p class="muted">السعرات: 1800 kcal · البروتين: 140 g · الكربوهيدرات: 180 g · الدهون: 60 g · الألياف: 30 g</p><p class="muted">تم وضعها كأهداف بداية مناسبة لتطبيق تنشيف، ويمكن جعلها قابلة للتعديل في النسخة التالية.</p></div><button class="secondary" onclick="if(confirm('سيتم حذف جميع الأطعمة والسجل. هل أنت متأكد؟')){localStorage.clear();location.reload()}">مسح كل بيانات التطبيق</button>`;showModal()}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderHome();
</script>
